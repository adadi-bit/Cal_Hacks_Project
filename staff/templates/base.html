<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ember staff{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root { --ink:#2b3440; --muted:#3f4b59; --line:#ddd7cd; --bg:#f6f3ee; --soft:#ece7df; --red:#b00020; --amber:#8a5a00; --ok:#1b5e20; --focus:#9e4208; }
  * { box-sizing: border-box; }
  body { margin:0; font: 17px/1.5 Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  .steps { display:flex; gap:0; margin:0 0 14px; padding:0; list-style:none; border:2px solid var(--ink); border-radius:8px; overflow:hidden; }
  .steps li { flex:1; padding:8px 12px; border-right:2px solid var(--ink); font-weight:700; background:#fff; }
  .steps li:last-child { border-right:0; } .steps li .n { display:inline-block; min-width:26px; height:26px; line-height:22px; text-align:center; border:2px solid var(--ink); border-radius:50%; margin-right:6px; }
  .steps li.done { background:#dff3e2; } .steps li.now { background:var(--ink); color:#fff; } .steps li.now .n { border-color:#fff; }
  .steps li small { display:block; font-weight:400; color:var(--muted); } .steps li.now small { color:#ddd; }
  .summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:0 0 14px; }
  .summary a { display:block; border:2px solid var(--ink); border-radius:8px; padding:10px 12px; color:var(--ink); text-decoration:none; }
  .summary a.on { background:var(--ink); color:#fff; } .summary a b { font-size:28px; display:block; line-height:1.1; }
  .next { border:2px solid var(--focus); border-radius:8px; padding:10px 14px; margin:0 0 14px; background:#fbe9dc; font-weight:600; }
  .btn, button { min-height:40px; }
  header.top { display:flex; align-items:center; gap:16px; padding:10px 20px; border-bottom:2px solid var(--ink); }
  header.top a.brand { font-weight:800; font-size:20px; color:var(--ink); text-decoration:none; }
  header.top nav { margin-left:auto; display:flex; gap:12px; align-items:center; }
  main { padding:16px 20px 60px; }
  a { color:#9e4208; }
  h1 { font-size:24px; margin:4px 0 12px; } h2 { font-size:19px; margin:18px 0 8px; } h3 { font-size:16px; margin:12px 0 6px; }
  table.grid { border-collapse:collapse; width:100%; }
  table.grid th, table.grid td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
  table.grid th { background:var(--soft); font-size:14px; }
  .btn, button { font:inherit; font-weight:600; padding:7px 14px; border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:6px; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.primary, button.primary { background:var(--ink); color:#fff; }
  button:disabled, .btn.disabled { opacity:.45; cursor:not-allowed; pointer-events:none; }
  button.small, .btn.small { padding:3px 9px; font-size:14px; border-width:1.5px; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; border:1.5px solid var(--ink); font-size:13px; font-weight:700; }
  .badge.none { border-style:dashed; color:var(--muted); } .badge.draft { background:#fff4d6; } .badge.stamped { background:#dff3e2; } .badge.printed { background:var(--ink); color:#fff; }
  .badge.order, .badge.warning { background:var(--red); color:#fff; border-color:var(--red); }
  .err, .needs { color:var(--red); font-weight:700; }
  .warn { color:var(--amber); font-weight:600; }
  .muted { color:var(--muted); }
  .flash { padding:8px 12px; border:2px solid var(--ink); background:var(--soft); margin-bottom:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label { font-weight:600; }
  input[type=text], input[type=number], input[type=tel], input[type=password], select, textarea { font:inherit; padding:6px 8px; border:1.5px solid #777; border-radius:5px; }
  fieldset { border:1.5px solid var(--line); border-radius:8px; margin:0 0 14px; padding:10px 14px; }
  legend { font-weight:800; padding:0 6px; }
  .banner { background:#fff4d6; border-bottom:2px solid var(--amber); padding:6px 20px; font-size:14px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if gate_open %}<div class="banner">No passphrase is set (EMBER_PASSPHRASE). Anyone on this laptop can open the tool.</div>{% endif %}
<header class="top">
  <a class="brand" href="/">Ember</a><span class="muted">evacuation cards for clients who cannot just drive away</span>
  <nav>
    <a href="/">Clients</a>
    <a href="/print-queue">Print queue</a>
    <form method="post" action="/logout" style="margin:0"><button class="small" type="submit">Lock</button></form>
  </nav>
</header>
<main>
<div id="flash"></div>
{% block main %}{% endblock %}
</main>
</body>
</html>
